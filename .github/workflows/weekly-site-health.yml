name: Weekly Technical Site Health Audit

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  health-check:
    name: Build & Audit Site Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Entity & Contact QA Audit
        run: npm run qa

      - name: Build Production Bundle
        run: npm run build

      - name: Start Production Preview Server
        run: npm run preview &

      - name: Wait for Preview Server
        run: npx wait-on http://localhost:4321

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Site Health Crawl & Tests
        run: npx playwright test
