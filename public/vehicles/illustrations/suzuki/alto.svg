<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="altoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="375" rx="300" ry="20" fill="url(#shadow)" />

  <g id="suzuki-alto">
    <!-- Compact Hatchback Frame -->
    <path d="M 170,320 L 190,260 Q 230,180 340,175 L 480,175 Q 560,180 610,240 L 660,280 L 670,320 Q 670,330 640,330 L 190,330 Z" fill="url(#altoBody)" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 320,180 L 380,125 Q 460,120 540,125 L 595,180 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <line x1="450" y1="123" x2="460" y2="178" stroke="#475569" stroke-width="4"/>

    <!-- Compact Headlight -->
    <polygon points="610,240 660,260 635,275 595,255" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Wheels -->
    <g transform="translate(260, 320)">
      <circle cx="0" cy="0" r="34" fill="#0f172a"/>
      <circle cx="0" cy="0" r="22" fill="#94a3b8" stroke="#f8fafc" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#334155"/>
    </g>
    <g transform="translate(540, 320)">
      <circle cx="0" cy="0" r="34" fill="#0f172a"/>
      <circle cx="0" cy="0" r="22" fill="#94a3b8" stroke="#f8fafc" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#334155"/>
    </g>
  </g>

  <rect x="330" y="380" width="140" height="22" rx="11" fill="#0284c7"/>
  <text x="400" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="extrabold" fill="#ffffff" text-anchor="middle" letter-spacing="1">SUZUKI ALTO 660CC</text>
</svg>
