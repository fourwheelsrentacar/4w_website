<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vanBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="385" rx="360" ry="28" fill="url(#shadow)" />

  <g id="hiace-van">
    <!-- High Roof Van Body -->
    <path d="M 100,330 L 110,170 Q 120,130 180,120 L 600,120 Q 670,130 700,200 L 730,280 L 730,330 Q 730,345 700,345 L 120,345 Z" fill="url(#vanBody)" stroke="#94a3b8" stroke-width="2.5"/>

    <!-- High Roof Side Windows -->
    <rect x="200" y="140" width="120" height="65" rx="8" fill="#1e293b"/>
    <rect x="340" y="140" width="130" height="65" rx="8" fill="#1e293b"/>
    <rect x="490" y="140" width="130" height="65" rx="8" fill="#1e293b"/>
    <path d="M 635,145 L 685,200 L 635,200 Z" fill="#1e293b"/>

    <!-- Front Bumper & Headlight -->
    <polygon points="685,200 725,230 700,280 660,250" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>

    <!-- Wheels -->
    <g transform="translate(230, 335)">
      <circle cx="0" cy="0" r="44" fill="#0f172a"/>
      <circle cx="0" cy="0" r="28" fill="#94a3b8" stroke="#f8fafc" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#334155"/>
    </g>
    <g transform="translate(590, 335)">
      <circle cx="0" cy="0" r="44" fill="#0f172a"/>
      <circle cx="0" cy="0" r="28" fill="#94a3b8" stroke="#f8fafc" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#334155"/>
    </g>
  </g>

  <rect x="300" y="390" width="200" height="26" rx="13" fill="#0f172a"/>
  <text x="400" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="extrabold" fill="#ffffff" text-anchor="middle" letter-spacing="1">HIACE GRAND CABIN (13 SEAT)</text>
</svg>
