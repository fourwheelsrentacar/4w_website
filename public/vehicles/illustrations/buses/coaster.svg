<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="busBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="390" rx="370" ry="28" fill="url(#shadow)" />

  <g id="coaster-bus">
    <!-- Executive Bus Body -->
    <path d="M 80,335 L 90,160 Q 100,110 160,110 L 630,110 Q 710,120 730,200 L 750,290 L 750,335 Q 750,350 720,350 L 110,350 Z" fill="url(#busBody)" stroke="#ca8a04" stroke-width="2.5"/>

    <!-- Panoramic Executive Glass Strip -->
    <rect x="180" y="130" width="90" height="75" rx="6" fill="#1e293b"/>
    <rect x="280" y="130" width="100" height="75" rx="6" fill="#1e293b"/>
    <rect x="390" y="130" width="100" height="75" rx="6" fill="#1e293b"/>
    <rect x="500" y="130" width="100" height="75" rx="6" fill="#1e293b"/>
    <rect x="610" y="130" width="80" height="75" rx="6" fill="#1e293b"/>

    <!-- Executive Gold Accent Strip -->
    <path d="M 90,240 L 745,240 L 740,260 L 95,260 Z" fill="#ca8a04"/>

    <!-- Front Bumper & Headlights -->
    <polygon points="710,200 745,230 730,290 690,260" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>

    <!-- Wheels -->
    <g transform="translate(220, 340)">
      <circle cx="0" cy="0" r="46" fill="#0f172a"/>
      <circle cx="0" cy="0" r="30" fill="#94a3b8" stroke="#f8fafc" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#1e293b"/>
    </g>
    <g transform="translate(610, 340)">
      <circle cx="0" cy="0" r="46" fill="#0f172a"/>
      <circle cx="0" cy="0" r="30" fill="#94a3b8" stroke="#f8fafc" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#1e293b"/>
    </g>
  </g>

  <rect x="280" y="395" width="240" height="26" rx="13" fill="#854d0e"/>
  <text x="400" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="extrabold" fill="#ffffff" text-anchor="middle" letter-spacing="1">TOYOTA COASTER SALOON EXECUTIVE</text>
</svg>
