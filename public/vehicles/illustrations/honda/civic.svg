<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hondaBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="380" rx="350" ry="24" fill="url(#shadow)" />

  <g id="honda-civic">
    <!-- Sport Fastback Silhouette -->
    <path d="M 110,325 L 140,270 Q 210,210 320,195 L 490,190 Q 580,195 650,245 L 720,280 L 730,325 Q 730,335 700,335 L 130,335 Z" fill="url(#hondaBody)" stroke="#475569" stroke-width="2"/>
    <path d="M 290,198 L 370,132 Q 450,130 550,135 L 635,200 Z" fill="url(#glassGrad)" stroke="#1e293b" stroke-width="2"/>
    <line x1="460" y1="132" x2="475" y2="195" stroke="#0f172a" stroke-width="4"/>

    <!-- Sharp LED Headlight -->
    <polygon points="655,245 725,265 690,280 645,260" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>

    <!-- Wheels -->
    <g transform="translate(230, 325)">
      <circle cx="0" cy="0" r="40" fill="#0f172a"/>
      <circle cx="0" cy="0" r="26" fill="#94a3b8" stroke="#e2e8f0" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#1e293b"/>
    </g>
    <g transform="translate(590, 325)">
      <circle cx="0" cy="0" r="40" fill="#0f172a"/>
      <circle cx="0" cy="0" r="26" fill="#94a3b8" stroke="#e2e8f0" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#1e293b"/>
    </g>
  </g>

  <rect x="330" y="388" width="140" height="24" rx="12" fill="#0284c7"/>
  <text x="400" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="extrabold" fill="#ffffff" text-anchor="middle" letter-spacing="1">HONDA CIVIC RS</text>
</svg>
