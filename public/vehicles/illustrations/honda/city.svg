<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="380" rx="340" ry="25" fill="url(#shadow)" />

  <!-- Car Body Silhouette -->
  <g id="car-body">
    <path d="M 120,330 L 150,280 Q 200,230 290,210 L 480,200 Q 560,200 640,245 L 700,280 L 720,320 Q 720,340 690,340 L 140,340 Q 120,340 120,330 Z" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 280,215 L 350,140 Q 420,135 520,140 L 615,215 Q 480,210 280,215 Z" fill="url(#glassGrad)" stroke="#334155" stroke-width="2"/>
    <line x1="450" y1="140" x2="465" y2="210" stroke="#475569" stroke-width="4"/>
    <polygon points="650,250 710,270 680,285 640,265" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 680,285 L 715,310 L 670,320" fill="none" stroke="#475569" stroke-width="3"/>
    <path d="M 670,295 L 700,305" fill="none" stroke="url(#redAccent)" stroke-width="2"/>
    <path d="M 220,250 Q 450,240 660,260" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="340" y="245" width="25" height="6" rx="2" fill="#64748b"/>
    <rect x="480" y="245" width="25" height="6" rx="2" fill="#64748b"/>

    <g transform="translate(240, 330)">
      <circle cx="0" cy="0" r="42" fill="#0f172a"/>
      <circle cx="0" cy="0" r="28" fill="#64748b" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#334155"/>
    </g>
    <g transform="translate(580, 330)">
      <circle cx="0" cy="0" r="42" fill="#0f172a"/>
      <circle cx="0" cy="0" r="28" fill="#64748b" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#334155"/>
    </g>
  </g>

  <!-- Brand Label Badge -->
  <rect x="300" y="385" width="200" height="26" rx="13" fill="#0f172a" opacity="0.9"/>
  <text x="400" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">HONDA CITY</text>
</svg>